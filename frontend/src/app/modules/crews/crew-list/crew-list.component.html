<div class="crews-container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h4 class="fw-bold mb-0">Restoration Crews &amp; Field Units</h4>
      <small class="text-muted">Field personnel readiness, assigned vehicles, and operational status</small>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-12 col-md-6 col-lg-4" *ngFor="let c of crews">
      <div class="card h-100 border-0 shadow-sm p-3 bg-white rounded-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="badge bg-dark font-mono">{{ c.crewCode }}</span>
          <span class="badge" [ngClass]="c.availabilityStatus === 'AVAILABLE' ? 'bg-success' : (c.availabilityStatus === 'DISPATCHED' ? 'bg-warning text-dark' : 'bg-info')">
            {{ c.availabilityStatus }}
          </span>
        </div>
        <h5 class="fw-bold mb-1">{{ c.crewName }}</h5>
        <div class="text-muted small mb-2"><i class="bi bi-geo-alt me-1"></i>Base: {{ c.baseAreaName }}</div>

        <div class="bg-light p-2 rounded small my-2">
          <div class="d-flex justify-content-between">
            <span class="text-muted">Vehicle:</span>
            <span class="fw-semibold font-mono">{{ c.vehicleNumber }}</span>
          </div>
          <div class="d-flex justify-content-between">
            <span class="text-muted">Phone:</span>
            <span>{{ c.contactPhone }}</span>
          </div>
          <div class="d-flex justify-content-between">
            <span class="text-muted">Specialty:</span>
            <span>{{ c.skillSpecialization }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
