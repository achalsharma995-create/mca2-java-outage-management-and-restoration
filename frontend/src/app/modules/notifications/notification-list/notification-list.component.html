<div class="notifications-container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h4 class="fw-bold mb-0">Customer Communication Audit</h4>
      <small class="text-muted">SMS, Email, and In-App notification logs generated across incident states</small>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-12 col-md-6" *ngFor="let n of notifications">
      <div class="card h-100 border-0 shadow-sm p-3 bg-white rounded-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="badge" [ngClass]="n.eventType === 'POWER_RESTORED' ? 'bg-success' : 'bg-primary'">{{ n.eventType }}</span>
          <div class="d-flex gap-2">
            <span class="badge bg-light text-muted font-mono">{{ n.channel }}</span>
            <small class="text-muted">{{ n.sentAt }}</small>
          </div>
        </div>
        <h6 class="fw-bold mb-1">{{ n.title }}</h6>
        <p class="text-muted small mb-0">{{ n.message }}</p>
      </div>
    </div>
  </div>
</div>
