<div class="app-layout">
  <!-- Top Navigation Header -->
  <header class="navbar navbar-dark bg-dark px-4 py-2 border-bottom border-primary border-3 shadow-sm">
    <div class="container-fluid d-flex justify-content-between align-items-center p-0">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-lightning-charge-fill text-warning fs-4"></i>
        <span class="navbar-brand m-0 fw-bold fs-5">GridFlow <span class="text-info">OMRS</span></span>
        <span class="badge bg-primary-subtle text-primary ms-2 font-mono" style="font-size: 0.7rem;">J16 Energy &amp; Utilities</span>
      </div>

      <div class="d-flex align-items-center gap-3" *ngIf="authService.currentUser$ | async as user">
        <span class="badge bg-secondary font-mono">{{ user.roles.join(', ') }}</span>
        <span class="text-white small fw-semibold">{{ user.fullName }}</span>
        <button class="btn btn-outline-danger btn-sm" (click)="authService.logout()">
          <i class="bi bi-box-arrow-right me-1"></i>Logout
        </button>
      </div>
    </div>
  </header>

  <!-- Router Outlet Container -->
  <main class="main-body p-4">
    <router-outlet></router-outlet>
  </main>
</div>
