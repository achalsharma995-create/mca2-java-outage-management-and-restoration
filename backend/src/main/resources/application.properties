# ==============================================================================
# Outage Management and Restoration System (OMRS) - Application Configuration
# ==============================================================================

server.port=8080
server.servlet.context-path=/api

# ------------------------------------------------------------------------------
# Oracle Database 21c XE Connection
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
spring.datasource.username=omrs_user
spring.datasource.password=omrs_password
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ------------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# JWT Security Configuration
# Secret key: minimum 256-bit base64-encoded string for HMAC-SHA256
# ------------------------------------------------------------------------------
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-milliseconds=86400000

# ------------------------------------------------------------------------------
# OpenAPI / Swagger UI
# ------------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
logging.level.com.omrs=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
